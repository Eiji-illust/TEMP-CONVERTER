<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperature-Calculator</title>
    <link rel="stylesheet" href="styles.css">
    <meta property="og:title" content="Temp-converter">
    <meta property="og:image" content="logo.png">
    <meta property="og:description" content="Website dedicated for Value conversions of temperatures">
    <meta property="og:locale" content="en_PH">
    <meta property="og:site_name" content="TempConv">

</head>
<body>
    <header>
        <div class="navBar">
            <nav>
                <h1>Temperature Converter</h1>
            </nav>
        </div>
    </header>
    <main>
        <div class="inputSection">
            <h3>Value to convert</h3>
            <fieldset>
                <legend>Current Temp</legend>
                <input type="text" id="tempValue" placeholder="Enter a value e.g (25, 50, 100)">
            </fieldset>
            
            <select name="" id="tempType">
                <option name="temperature" value="CF">Celsius to Kelvin</option>
                <option name="temperature" value="CK">Celsius to Fahrenheit</option>
                <option name="temperature" value="FC">Fahrenheit to Celsius</option>
                <option name="temperature" value="FK">Fahrenheit to Kelvin</option>
                <option value="KC">Kelvin to Celsius</option>
                <option value="KF">Kelvin to Fahrenheit</option>
            </select>
            <!-- <div class="tempType">
                <label for=""><input type="radio" name="temperature" id="CF">Celsius -> Fahrenheit</label><br>
                <label for=""><input type="radio" name="temperature" id="CK">Celsius -> Kelvin</label><br>
                <label for=""><input type="radio" name="temperature" id="FC">Fahrenheit -> Celsius</label><br>
                <label for=""><input type="radio" name="temperature" id="FK">Fahrenheit -> Kelvin</label><br>
                <label for=""><input type="radio" name="temperature" id="KC">Kelvin -> Celsius</label><br>
                <label for=""><input type="radio" name="temperature" id="KF">Kelvin -> Fahrenheit</label><br>
                <br>
            </div> -->
            
            <button type="submit" id="submitBtn">Submit</button>
        </div>
        <div class="summarySection" id="summarySection">
            <h3>Summary</h3>
            
        </div>
    </main>
    <footer>
        <hr>
        <p>Copyright 2026</p>
    </footer>

    <script src="test.js"></script>
</body>
</html>
